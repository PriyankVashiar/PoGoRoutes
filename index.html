<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Go Route Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0">
</head>
<body>

    <header class="header-container">
        <div class="header-left">
            <select id="city-select" class="city-dropdown" aria-label="Select city">
                <option value="" selected disabled>Loading cities…</option>
            </select>
            <h1 class="main-title">Pokémon Go Route Generator</h1>
        </div>

        <div class="route-controls">
            <input
                type="text"
                id="currentLocationInput"
                class="control-input"
                placeholder="Current Location (Lat, Lng) Optional"
                title="Current Location (Lat, Lng) Optional"
                autocomplete="off"
                aria-label="Optional start coordinates latitude, longitude"
            />

            <button type="button" id="generateRouteBtn" class="btn-primary">
                Generate Route
            </button>

            <button
                type="button"
                id="importRouteBtn"
                class="btn-icon"
                title="Generate and import route into GPS Joystick"
                aria-label="Generate and import route into GPS Joystick"
            >
                <span class="material-symbols-outlined" aria-hidden="true">move_location</span>
            </button>

            <button type="button" id="donateBtn" class="btn-secondary">
                ☕ Donate
            </button>
        </div>
    </header>

    <div id="status-bar" class="status-bar" role="status" aria-live="polite" hidden></div>

    <div class="preset-bar" aria-label="Filter presets">
        <label class="preset-label" for="preset-select">Presets</label>
        <select id="preset-select" class="preset-select" aria-label="Saved filter presets">
        </select>
        <button type="button" id="preset-load-btn" class="btn-preset">Load</button>
        <button type="button" id="preset-save-btn" class="btn-preset">Save current</button>
        <button type="button" id="preset-delete-btn" class="btn-preset btn-preset-danger">Delete</button>
        <button type="button" id="preset-clear-btn" class="btn-preset">Clear filters</button>
    </div>

    <div class="cards-grid">
        <div class="card">
            <div class="card-header">
                <img src="./assets/icons/Items.png" alt="" class="header-icon">
                Items
            </div>
            <div class="card-body" id="card-2"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <img src="./assets/icons/Stardust.png" alt="" class="header-icon">
                Stardust
            </div>
            <div class="card-body" id="card-3"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <img src="./assets/icons/Pokémon.png" alt="" class="header-icon">
                Pokémon
            </div>
            <div class="card-body" id="card-7"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <img src="./assets/icons/Mega_Energy.png" alt="" class="header-icon">
                Mega Energy
            </div>
            <div class="card-body" id="card-12"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
